spring:
  application:
    name: uphi-backend
    
  data:
    mongodb:
      uri: "mongodb://localhost:27017/uphi"
  mongodb:
    uri: "mongodb://localhost:27017/uphi"

  mail:
    host: smtp.gmail.com
    port: 587
    username: uphi.fc@gmail.com
    password: ${MAIL_PASSWORD:your_app_password}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:your_jwt_secret}
  expiration: 86400000 # 24 hours in milliseconds

gemini:
  api-key: ${GEMINI_API_KEY:your_api_key}
  model: gemini-2.0-flash
 
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
  auth-token: ${TWILIO_AUTH_TOKEN:your_auth_token}
  from-number: ${TWILIO_FROM_NUMBER:+1234567890}
